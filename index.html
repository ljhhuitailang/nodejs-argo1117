/* ========== CSS变量 ========== */
:root {
  --bg-dark: #0a0e27;
  --bg-darker: #060918;
  --card-bg: rgba(255,255,255,0.06);
  --card-border: rgba(255,255,255,0.1);
  --card-hover: rgba(255,255,255,0.12);
  --text-primary: #e8eaf6;
  --text-secondary: #a0a4c0;
  --accent-1: #7c4dff;
  --accent-2: #00bcd4;
  --accent-3: #ff6f00;
  --accent-4: #e91e63;
  --shadow: 0 8px 32px rgba(0,0,0,0.3);
  --radius: 16px;
}

/* ========== 全局重置 ========== */
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg-darker);
  color: var(--text-primary);
  min-height:100vh;
  overflow-x:hidden;
}

/* ========== 星空背景 ========== */
body::before {
  content:'';
  position:fixed; top:0; left:0; width:100%; height:100%;
  background: radial-gradient(ellipse at 20% 50%, rgba(124,77,255,0.15) 0%, transparent 50%),
              radial-gradient(ellipse at 80% 20%, rgba(0,188,212,0.1) 0%, transparent 50%),
              radial-gradient(ellipse at 50% 80%, rgba(233,30,99,0.08) 0%, transparent 50%);
  z-index:-2;
}
body::after {
  content:'';
  position:fixed; top:0; left:0; width:100%; height:100%;
  background-image:
    radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.8), transparent),
    radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.9), transparent),
    radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.7), transparent),
    radial-gradient(1.5px 1.5px at 15% 90%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 55% 35%, rgba(255,255,255,0.8), transparent),
    radial-gradient(1px 1px at 80% 70%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 40% 75%, rgba(255,255,255,0.7), transparent),
    radial-gradient(1.5px 1.5px at 65% 15%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 25% 45%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 85% 55%, rgba(255,255,255,0.8), transparent);
  animation: twinkle 4s ease-in-out infinite alternate;
  z-index:-1;
}
@keyframes twinkle { 0%{opacity:.6} 100%{opacity:1} }

/* ========== 顶部区域 ========== */
.header {
  text-align:center;
  padding: 50px 20px 30px;
}
.header h1 {
  font-size: clamp(2rem, 5vw, 3.5rem);
  background: linear-gradient(135deg, #7c4dff, #00bcd4, #e91e63, #ff6f00);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradientShift 6s ease infinite;
  margin-bottom: 10px;
}
@keyframes gradientShift {
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}
.header p { color: var(--text-secondary); font-size: 1.1rem; }
.header .datetime {
  margin-top: 12px; font-size: 0.95rem; color: var(--text-secondary);
  display:flex; justify-content:center; gap:20px; flex-wrap:wrap;
}

/* ========== 搜索区域 ========== */
.search-container {
  max-width:680px; margin: 20px auto 10px; padding: 0 20px;
}
.search-box {
  display:flex; gap:8px; background: var(--card-bg);
  backdrop-filter:blur(12px); border:1px solid var(--card-border);
  border-radius:50px; padding:6px; transition:all .3s;
}
.search-box:focus-within {
  border-color: var(--accent-1);
  box-shadow: 0 0 0 3px rgba(124,77,255,0.2);
}
.search-box input {
  flex:1; background:transparent; border:none; outline:none;
  color:var(--text-primary); font-size:1rem; padding:12px 20px;
}
.search-box input::placeholder { color: var(--text-secondary); }
.search-box select {
  background:rgba(124,77,255,0.2); border:none; border-radius:30px;
  color:var(--text-primary); padding:0 14px; font-size:.9rem; outline:none;
  cursor:pointer;
}
.search-box button {
  background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
  border:none; border-radius:30px; color:#fff; padding:0 24px;
  font-size:1rem; cursor:pointer; transition:transform .2s;
}
.search-box button:hover { transform:scale(1.05); }

/* ========== 快捷操作 ========== */
.quick-actions {
  display:flex; justify-content:center; gap:12px; flex-wrap:wrap;
  padding: 10px 20px 20px;
}
.quick-actions button {
  background:var(--card-bg); border:1px solid var(--card-border);
  color:var(--text-secondary); padding:8px 18px; border-radius:30px;
  cursor:pointer; font-size:.9rem; transition:all .3s;
  backdrop-filter:blur(8px);
}
.quick-actions button:hover {
  background:var(--card-hover); color:var(--text-primary);
  border-color: var(--accent-1);
}

/* ========== 分类导航条 ========== */
.category-nav {
  max-width:1200px; margin:10px auto; padding:0 20px;
  display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
}
.category-nav a {
  background:var(--card-bg); border:1px solid var(--card-border);
  color:var(--text-secondary); padding:6px 16px; border-radius:20px;
  text-decoration:none; font-size:.85rem; transition:all .3s;
}
.category-nav a:hover {
  background:rgba(124,77,255,0.2); color:#fff;
  border-color:var(--accent-1);
}

/* ========== 主内容区 ========== */
.main-content {
  max-width:1200px; margin:0 auto; padding:20px;
}

/* ========== 分类区块 ========== */
.category-section { margin-bottom:36px; }
.category-header {
  display:flex; align-items:center; gap:10px;
  margin-bottom:16px; cursor:pointer; user-select:none;
}
.category-header h2 {
  font-size:1.4rem; display:flex; align-items:center; gap:8px;
}
.category-header .toggle-icon {
  font-size:1rem; color:var(--text-secondary);
  transition:transform .3s; margin-left:auto;
}
.category-section.collapsed .toggle-icon { transform:rotate(-90deg); }
.category-section.collapsed .nav-grid { display:none; }

/* ========== 导航卡片网格 ========== */
.nav-grid {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap:12px;
}
.nav-card {
  background:var(--card-bg); border:1px solid var(--card-border);
  border-radius:var(--radius); padding:16px 14px;
  text-decoration:none; color:var(--text-primary);
  transition:all .35s cubic-bezier(.4,0,.2,1);
  backdrop-filter:blur(10px); position:relative; overflow:hidden;
}
.nav-card::before {
  content:''; position:absolute; top:0; left:0; width:100%; height:3px;
  background:linear-gradient(90deg, var(--accent-1), var(--accent-2));
  opacity:0; transition:opacity .3s;
}
.nav-card:hover {
  transform:translateY(-4px);
  background:var(--card-hover);
  border-color:rgba(124,77,255,0.4);
  box-shadow:0 12px 40px rgba(124,77,255,0.2);
}
.nav-card:hover::before { opacity:1; }
.nav-card .card-icon {
  font-size:1.8rem; margin-bottom:8px; display:block;
}
.nav-card .card-title {
  font-size:1rem; font-weight:600; margin-bottom:4px;
}
.nav-card .card-desc {
  font-size:.78rem; color:var(--text-secondary); line-height:1.4;
}

/* ========== 返回顶部 ========== */
.back-to-top {
  position:fixed; bottom:30px; right:30px;
  width:48px; height:48px; border-radius:50%;
  background:linear-gradient(135deg, var(--accent-1), var(--accent-2));
  border:none; color:#fff; font-size:1.3rem; cursor:pointer;
  box-shadow:var(--shadow); opacity:0; visibility:hidden;
  transition:all .3s; z-index:100;
}
.back-to-top.show { opacity:1; visibility:visible; }
.back-to-top:hover { transform:scale(1.1); }

/* ========== 页脚 ========== */
.footer {
  text-align:center; padding:30px 20px 40px;
  color:var(--text-secondary); font-size:.85rem;
  border-top:1px solid var(--card-border); margin-top:40px;
}

/* ========== 提示弹窗 ========== */
.toast {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px);
  background:rgba(124,77,255,0.9); color:#fff; padding:10px 24px;
  border-radius:30px; font-size:.9rem; opacity:0; visibility:hidden;
  transition:all .3s; z-index:200; backdrop-filter:blur(8px);
}
.toast.show { opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }

/* ========== 响应式 ========== */
@media (max-width:768px) {
  .nav-grid { grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap:10px; }
  .search-box { flex-wrap:wrap; border-radius:20px; }
  .search-box input { min-width:100%; order:1; }
  .search-box select { order:2; }
  .search-box button { order:3; flex:1; padding:10px; }
  .header .datetime { font-size:.85rem; }
}
</style>

/* ========== 渲染分类导航条 ========== */
const navContainer = document.getElementById('categoryNav');

  const a = document.createElement('a');
  a.href = `#cat-${idx}`;
  a.textContent = cat.name;
  navContainer.appendChild(a);
});

/* ========== 渲染主内容 ========== */
const mainContainer = document.getElementById('mainContent');
categories.forEach((cat, idx) => {
  const section = document.createElement('div');
  section.className = 'category-section';
  section.id = `cat-${idx}`;

  const header = document.createElement('div');
  header.className = 'category-header';
  header.innerHTML = `<h2>${cat.name}</h2><span class="toggle-icon">▼</span>`;
  header.onclick = () => section.classList.toggle('collapsed');

  const grid = document.createElement('div');
  grid.className = 'nav-grid';

  cat.sites.forEach(site => {
    const card = document.createElement('a');
    card.className = 'nav-card';
    card.href = site.url;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    card.innerHTML = `
      <span class="card-icon">${cat.icon}</span>
      <div class="card-title">${site.name}</div>
      <div class="card-desc">${site.desc}</div>
    `;
    grid.appendChild(card);
  });

  section.appendChild(header);
  section.appendChild(grid);
  mainContainer.appendChild(section);
});

/* ========== 搜索功能 ========== */
const engines = {
  baidu:  (q) => `https://www.baidu.com/s?wd=${encodeURIComponent(q)}`,
  google: (q) => `https://www.google.com/search?q=${encodeURIComponent(q)}`,
  bing:   (q) => `https://www.bing.com/search?q=${encodeURIComponent(q)}`,
  duckduckgo: (q) => `https://duckduckgo.com/?q=${encodeURIComponent(q)}`,
  github: (q) => `https://github.com/search?q=${encodeURIComponent(q)}`,
  zhihu:  (q) => `https://www.zhihu.com/search?q=${encodeURIComponent(q)}`,
};
function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { showToast('⚠️ 请输入搜索内容'); return; }
  const eng = document.getElementById('searchEngine').value;
  window.open(engines[eng](q), '_blank');
}
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

/* ========== 时钟 ========== */
function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString('zh-CN', { hour12:false });
  const date = now.toLocaleDateString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', weekday:'short' });
  document.getElementById('clock').textContent = `🕐 ${time}`;
  document.getElementById('date').textContent = `📅 ${date}`;
}
updateClock(); setInterval(updateClock, 1000);

/* ========== 快捷操作 ========== */
function addBookmark() {
  showToast('⭐ 请按 ' + (navigator.userAgent.match(/Mac/) ? '⌘+D' : 'Ctrl+D') + ' 收藏此页');
}
function setHomepage() {
  showToast('🏠 请在浏览器设置中将此页设为主页');
}
function clearData() {
  if (confirm('确定要清除所有本地数据吗？')) {
    localStorage.clear();
    sessionStorage.clear();
    showToast('✅ 数据已清除');
  }
}

/* ========== Toast提示 ========== */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

/* ========== 返回顶部 ========== */
window.addEventListener('scroll', () => {
  const btn = document.getElementById('backToTop');
  btn.classList.toggle('show', window.scrollY > 400);
});

/* ========== 键盘快捷键 ========== */
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  if (e.key === 'Escape') document.getElementById('searchInput').blur();
});
</script>
